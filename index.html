if(/invalid-credential|wrong-password|user-not-found/.test(c))return b?"ফোন নম্বর বা পাসওয়ার্ড ভুল":"Wrong phone or password";
if(c==="auth/email-already-in-use")return b?"এই নম্বরে অ্যাকাউন্ট আছে, লগইন করুন":"Account exists, please login";
if(c==="auth/weak-password")return b?"পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দিন":"Password needs 6+ characters";
if(c==="auth/unauthorized-domain")return b?"এই ডোমেইন Firebase-এ অনুমোদিত নয়":"Domain not authorized in Firebase";
return(b?"সমস্যা হয়েছে: ":"Error: ")+c}
window.openAcc=async function(msg){const b=bn();let h;
if(FU){let rows="";
try{const s=await getDocs(query(collection(db,"orders"),where("uid","==",FU.uid)));const a=[];s.forEach(d=>a.push({...d.data(),id:d.id}));
a.sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
a.forEach(o=>{const d=o.createdAt?o.createdAt.toDate().toLocaleString(b?"bn-BD":"en-GB",{dateStyle:"medium",timeStyle:"short"}):"",it=(o.items||[]).map(i=>esc(b?(i.bn||i.name):(i.name||i.bn))+" × "+N(i.qty)).join(", ");
MYO[o.id]=o;const left=Math.ceil((1800000-(o.createdAt?Date.now()-o.createdAt.toMillis():0))/60000),can=o.status==="new"&&left>0,
btns=`<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap"><button class="add" style="padding:6px 12px" onclick="reorder('${o.id}')">🔁 ${b?"আবার অর্ডার করুন":"Order again"}</button>${can?`<button class="add" style="padding:6px 12px;color:#d6336c;border-color:#d6336c" onclick="cancelOrder('${o.id}')">❌ ${b?"বাতিল করুন ("+N(Math.min(left,30))+" মিনিট বাকি)":"Cancel ("+Math.min(left,30)+" min left)"}</button>`:""}</div>`;
rows+=`<div class="li" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(o.no)} · ${(ST[o.status]||[o.status,o.status])[b?0:1]}</span><b>৳${N(o.total)}</b></div><div class="note" style="margin:2px 0">${esc(d)}</div><div class="note" style="margin:0">${it}</div>${btns}</div>`})}catch(e){}
h=`<h3>👤 ${esc(FU.name)}</h3><p class="note">📞 ${esc(FU.phone)}</p><b>${b?"আমার অর্ডার":"My orders"}</b>${rows||`<div class="empty">${b?"এখনো কোনো অর্ডার নেই":"No orders yet"}</div>`}<button class="add" style="width:100%;margin-top:12px" onclick="logout()">${b?"লগআউট":"Log out"}</button>`}
else{const r=AT==="r",i=(id,x,ph)=>`<input id="${id}" ${x} placeholder="${ph}">`;
h=`<h3>${b?"স্বাগতম":"Welcome"}</h3><div class="tabs" style="justify-content:flex-start"><button class="tab${r?"":" on"}" onclick="setAT('l')">${b?"লগইন":"Login"}</button><button class="tab${r?" on":""}" onclick="setAT('r')">${b?"নতুন অ্যাকাউন্ট":"Register"}</button></div><p class="note" style="margin-top:10px">${msg||(r?(b?"নাম, ফোন নম্বর, পাসওয়ার্ড ও ঠিকানা দিয়ে অ্যাকাউন্ট খুলুন।":"Enter name, phone, password and address."):(b?"ফোন নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন।":"Login with phone and password."))}</p>${r?i("un","",b?"আপনার নাম":"Your name"):""}${i("up",'inputmode="tel"',b?"ফোন নম্বর (01XXXXXXXXX)":"Phone (01XXXXXXXXX)")}${i("pw",'type="password"',b?"পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)":"Password (6+ characters)")}${r?`<textarea id="ua" rows="2" placeholder="${b?"ঠিকানা":"Address"}"></textarea>`:""}<p class="err" id="ue"></p>`+(r?`<button class="go" style="width:100%" onclick="doReg()">${b?"অ্যাকাউন্ট খুলুন":"Create account"}</button>`:`<button class="go" style="width:100%" onclick="doLogin()">${b?"লগইন":"Login"}</button><p class="note" style="margin-top:10px;text-align:center">${b?"পাসওয়ার্ড ভুলে গেছেন? ":"Forgot password? "}<a href="tel:+8801771671269" style="color:var(--brand2)">${b?"দোকানে কল করুন":"Call the shop"}</a></p>`)}
$("acc").innerHTML='<button class="x" onclick="closeCart()" aria-label="Close">✕</button>'+h;$("ov").style.display="block";$("acc").classList.add("show")};
const MYO=window.MYO={};
window.reorder=function(id){const o=MYO[id];if(!o)return;const b=bn(),miss=[];
(o.items||[]).forEach(i=>{const p=window.P.find(x=>String(x.id)===String(i.id))||window.P.find(x=>x.bn&&x.bn===i.bn)||window.P.find(x=>x.en&&x.en===i.name);
if(!p||p.active===false||av(p)<=0){miss.push(i.bn||i.name);return}
cart[p.id]=Math.min((cart[p.id]||0)+(Number(i.qty)||1),av(p))});
grid();upd();closeCart();openCart();
if(miss.length)setTimeout(()=>alert((b?"এই পণ্যগুলো এখন নেই: ":"Currently unavailable: ")+miss.join(", ")),200)};
window.cancelOrder=async function(id){const b=bn();if(!confirm(b?"এই অর্ডারটি বাতিল করবেন?":"Cancel this order?"))return;
try{await updateDoc(doc(db,"orders",id),{status:"cancelled"})}catch(e){alert(b?"বাতিল করা গেল না। ৩০ মিনিট পার হয়ে গেছে বা দোকান অর্ডার নিশ্চিত করেছে। দয়া করে দোকানে কল করুন।":"Could not cancel: the 30-minute window has passed or the shop has confirmed it. Please call the shop.")}
openAcc()};
function vals(){const g=i=>$(i)?$(i).value:"";return{n:g("un").trim(),p:g("up").replace(/\s/g,""),w:g("pw"),a:g("ua").trim()}}
function bad(v,needName){const b=bn();if(!/^01\d{9}$/.test(v.p))return b?"সঠিক ফোন নম্বর দিন (01XXXXXXXXX)":"Enter a valid phone (01XXXXXXXXX)";if(v.w.length<6)return b?"পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দিন":"Password needs 6+ characters";if(needName&&(!v.n||!v.a))return b?"নাম ও ঠিকানা দিন":"Enter name and address";return""}
window.doLogin=async function(){const v=vals(),m=bad(v,false);if(m){$("ue").textContent=m;return}
try{await signInWithEmailAndPassword(auth,mail(v.p),v.w);closeCart()}catch(e){$("ue").textContent=errMsg(e)}};
window.doReg=async function(){const v=vals(),m=bad(v,true);if(m){$("ue").textContent=m;return}
try{const c=await createUserWithEmailAndPassword(auth,mail(v.p),v.w);await updateProfile(c.user,{displayName:v.n});
await setDoc(doc(db,"users",c.user.uid),{name:v.n,phone:v.p,address:v.a});await loadUser(auth.currentUser);closeCart()}catch(e){$("ue").textContent=errMsg(e)}};
window.logout=function(){signOut(auth).then(closeCart)};
window.place=async function(m,n,f,a){
if(!FU){openAcc(bn()?"অর্ডার করতে আগে লগইন করুন (আপনার কার্ট সংরক্ষিত আছে)":"Please login to order (your cart is saved)");return}
const b=bn(),no="SS"+Date.now().toString().slice(-6),tot=total(),it=[];
P.forEach(p=>{if(cart[p.id])it.push({id:String(p.id),name:p.en,bn:p.bn,qty:cart[p.id],price:ep(p)})});
const btn=document.querySelector("#sheet .go");if(btn)btn.disabled=true;
try{await addDoc(collection(db,"orders"),{no,uid:FU.uid,name:n,phone:f,address:a,items:it,total:tot,status:"new",payment:"cod",createdAt:serverTimestamp()});
try{await setDoc(doc(db,"users",FU.uid),{name:FU.name,phone:FU.phone,address:a},{merge:true})}catch(e){}
cart={};grid();upd();
$("sheet").innerHTML=`<h3>✅ ${b?"অর্ডার সম্পন্ন":"Order placed"}</h3><p class="note"><b>${b?"অর্ডার নম্বর":"Order no"}: ${no}</b><br>${b?"মোট":"Total"}: ৳${N(tot)} · ${b?"ক্যাশ অন ডেলিভারি":"Cash on delivery"}</p><p>${b?"দোকান থেকে ফোন করে নিশ্চিত করা হবে।":"The shop will call to confirm."}</p><a class="add" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" target="_blank" rel="noopener" href="https://wa.me/8801771671269?text=${encodeURIComponent("Order "+no+"\n"+m)}">💬 ${b?"WhatsApp-এ দোকানকে জানান (ঐচ্ছিক)":"Also send on WhatsApp (optional)"}</a><button class="go" style="width:100%" onclick="again()">${b?"ঠিক আছে":"OK"}</button>`}
catch(e){if(btn)btn.disabled=false;$("err").textContent=b?"অর্ডার জমা হয়নি, আবার চেষ্টা করুন":"Order failed, try again"}};
</script>
</body>
</html>
